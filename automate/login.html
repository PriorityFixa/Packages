<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | Amani Wanjiru</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/style.css">

    <script src="config/business.js"></script>
    <script src="config/branding.js"></script>
    <script src="js/auth.js"></script>

    <style>
        .login-page {
            min-height: 70vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 1.5rem;
        }

        .login-card {
            width: 100%;
            max-width: 360px;
            background: var(--paper-raised);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            padding: 2rem;
        }

        .login-card h1 {
            font-size: 1.5rem;
            margin-bottom: 0.3em;
        }

        .login-card p {
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .login-error {
            display: none;
            background: #FBEBEB;
            border: 1px solid var(--danger);
            color: var(--danger);
            border-radius: var(--radius-sm);
            padding: 0.75rem 1rem;
            font-size: 0.85rem;
            margin-top: 1rem;
        }

        .login-error.visible {
            display: block;
        }
    </style>
</head>
<body>

    <header class="site-header">
        <a href="index.html" class="brand">
            <span id="business-name">Amani Wanjiru</span>
        </a>
    </header>

    <main class="login-page">

        <div class="login-card">

            <h1>Admin login</h1>
            <p>Enter the admin password to view the dashboard.</p>

            <form id="login-form">

                <div class="form-group">
                    <label for="admin-password">Password</label>
                    <input type="password" id="admin-password" required autofocus>
                </div>

                <button type="submit" class="btn add-to-cart" style="width:100%;" id="login-submit">
                    Log in
                </button>

                <div class="login-error" id="login-error"></div>

            </form>

        </div>

    </main>

    <script>
        document.getElementById("login-form").addEventListener("submit", async (event) => {
            event.preventDefault();

            const password = document.getElementById("admin-password").value;
            const submitButton = document.getElementById("login-submit");
            const errorBox = document.getElementById("login-error");

            errorBox.classList.remove("visible");
            submitButton.disabled = true;
            submitButton.textContent = "Logging in...";

            try {
                const response = await fetch(`${API_URL}/auth/login`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ password })
                });

                const result = await response.json();

                if (!response.ok || !result.success) {
                    throw new Error(result.error || "Login failed.");
                }

                setAuthToken(result.token);
                window.location.href = "dashboard.html";

            } catch (error) {
                errorBox.textContent = error.message;
                errorBox.classList.add("visible");
                submitButton.disabled = false;
                submitButton.textContent = "Log in";
            }
        });
    </script>

</body>
</html>
